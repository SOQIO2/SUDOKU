<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="format-detection" content="telephone=no">
<title>Судоку</title>
<script src="https://telegram.org/js/telegram-web-app.js?64"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,500;0,7..72,600;1,7..72,500&display=swap">
<style>
/* Цвета берутся из темы Telegram (--tg-theme-*). Значения --f-* — запасные, для открытия вне Telegram. */
:root {
  --f-bg: #ffffff;
  --f-surface: #f0f2f5;
  --f-text: #15191e;
  --f-hint: #8a93a0;
  --f-accent: #2b7be4;
  --f-on-accent: #ffffff;
  --f-ink: #1f6fd6;
  --f-danger: #d6383b;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --f-bg: #141a21; --f-surface: #1f2731; --f-text: #eef1f4; --f-hint: #7d8996;
    --f-accent: #4f97ea; --f-on-accent: #ffffff; --f-ink: #72b2f6; --f-danger: #f06464;
  }
}
:root[data-theme="dark"] {
  --f-bg: #141a21; --f-surface: #1f2731; --f-text: #eef1f4; --f-hint: #7d8996;
  --f-accent: #4f97ea; --f-on-accent: #ffffff; --f-ink: #72b2f6; --f-danger: #f06464;
}
:root {
  --bg: var(--tg-theme-bg-color, var(--f-bg));
  --surface: var(--tg-theme-secondary-bg-color, var(--f-surface));
  --section: var(--tg-theme-section-bg-color, var(--bg));
  --text: var(--tg-theme-text-color, var(--f-text));
  --hint: var(--tg-theme-hint-color, var(--f-hint));
  --accent: var(--tg-theme-button-color, var(--f-accent));
  --on-accent: var(--tg-theme-button-text-color, var(--f-on-accent));
  --ink: var(--tg-theme-accent-text-color, var(--tg-theme-link-color, var(--f-ink)));
  --danger: var(--tg-theme-destructive-text-color, var(--f-danger));

  --line: rgba(128, 138, 150, .3);
  --line-strong: rgba(110, 118, 128, .9);
  --peer: rgba(43, 123, 228, .08);
  --same: rgba(43, 123, 228, .2);
  --sel: rgba(43, 123, 228, .32);
  --err-bg: rgba(214, 56, 59, .1);
  --flash: rgba(43, 123, 228, .38);
  --sep: var(--tg-theme-section-separator-color, var(--line));

  --serif: "Literata", "Noto Serif", "Droid Serif", "Times New Roman", serif;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --safe-b: max(var(--tg-safe-area-inset-bottom, 0px), env(safe-area-inset-bottom, 0px));
}
@supports (color: color-mix(in srgb, red 50%, blue)) {
  :root {
    --line: color-mix(in srgb, var(--text) 15%, var(--bg));
    --line-strong: color-mix(in srgb, var(--text) 70%, var(--bg));
    --peer: color-mix(in srgb, var(--accent) 8%, var(--bg));
    --same: color-mix(in srgb, var(--accent) 21%, var(--bg));
    --sel: color-mix(in srgb, var(--accent) 34%, var(--bg));
    --err-bg: color-mix(in srgb, var(--danger) 12%, var(--bg));
    --flash: color-mix(in srgb, var(--accent) 42%, var(--bg));
  }
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--bg); color: var(--text); }
body {
  font-family: var(--sans);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  touch-action: manipulation;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; touch-action: manipulation; }
button:focus { outline: none; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg { display: block; }
[hidden] { display: none !important; }

/* ---------- Каркас ---------- */
.app {
  --board: max(250px, min(calc(100vw - 24px), 500px, calc(var(--app-h, 100vh) - 252px)));
  height: var(--app-h, 100vh);
  display: flex; flex-direction: column; align-items: center;
  padding: 6px 12px calc(10px + var(--safe-b));
}
.top, .play { width: var(--board); }
.top { display: flex; align-items: center; height: 44px; flex: none; }
.new {
  display: inline-flex; align-items: center; gap: 6px; height: 36px;
  padding: 0 10px 0 6px; margin-left: -6px; border-radius: 10px;
  color: var(--ink); font-size: 15px; font-weight: 600;
}
.new svg { width: 18px; height: 18px; }
.new:active, .icon:active { background: var(--surface); }
/* Поле со строкой состояния и управлением — один блок по центру свободной высоты. */
.play { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; gap: 12px; }
.meta {
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
  height: 32px; margin-bottom: -4px; flex: none; font-size: 14px; color: var(--hint);
}
.meta .lvl { color: var(--text); font-weight: 600; }
.meta .bad { color: var(--danger); }
.clock { justify-self: end; display: flex; align-items: center; gap: 2px; margin-right: -8px; }
.time { font-size: 15px; font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; }
.icon { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; color: var(--text); }
.icon svg { width: 18px; height: 18px; }

/* ---------- Поле ---------- */
.board-wrap { position: relative; width: var(--board); height: var(--board); flex: none; }
.board {
  width: 100%; height: 100%;
  display: grid; grid-template-columns: repeat(9, 1fr); grid-template-rows: repeat(9, 1fr);
  border: 2px solid var(--line-strong); border-radius: 8px; overflow: hidden;
  background: var(--bg);
}
.cell {
  position: relative; display: grid; place-items: center;
  border-right: 1px solid var(--line); border-bottom: 1px solid var(--line);
  font-family: var(--serif); font-size: calc(var(--board) * .066);
  cursor: pointer;
}
.cell.br { border-right: 2px solid var(--line-strong); }
.cell.br0 { border-right: 0; }
.cell.bb { border-bottom: 2px solid var(--line-strong); }
.cell.bb0 { border-bottom: 0; }
.cell.peer { background: var(--peer); }
.cell.same { background: var(--same); }
.cell.wrong { background: var(--err-bg); }
.cell.sel { background: var(--sel); }
.cell .fx { position: absolute; inset: 0; background: var(--flash); opacity: 0; pointer-events: none; }
.cell .fx.go { animation: fx .65s ease-out both; }
/* Открытые цифры — «печать», свои — курсивом цветом ручки, заметки — «карандашом». */
.cell .v { position: relative; display: inline-block; line-height: 1; font-weight: 600; font-variant-numeric: lining-nums tabular-nums; }
.cell.user .v { font-style: italic; font-weight: 500; color: var(--ink); }
.cell.wrong .v, .cell.clash .v { color: var(--danger); }
.cell .v.pop { animation: pop .5s ease-out both; }
.notes {
  position: absolute; inset: 7%;
  display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); place-items: center;
  font-family: var(--sans); font-size: calc(var(--board) * .027); line-height: 1;
  color: var(--hint); font-variant-numeric: tabular-nums;
}
.notes i { font-style: normal; }
.notes i.hl { color: var(--ink); font-weight: 700; }
@keyframes fx { 0% { opacity: 0; } 30% { opacity: 1; } 100% { opacity: 0; } }
@keyframes pop { 0%, 100% { transform: scale(1); } 45% { transform: scale(1.22); } }

.paused {
  position: absolute; inset: 0; border-radius: 8px; background: var(--surface);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
}
.paused p { font-family: var(--serif); font-size: 26px; font-weight: 600; }
.paused .btn { width: auto; padding: 0 28px; margin: 0; }

/* ---------- Инструменты и цифры ---------- */
.tools { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; flex: none; }
.tool { display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 12px; padding: 2px 0; }
.tool .ic {
  position: relative; width: 46px; height: 36px; border-radius: 12px;
  display: grid; place-items: center; background: var(--surface);
  transition: background .15s, color .15s, transform .1s;
}
.tool svg { width: 21px; height: 21px; }
.tool:active .ic { transform: scale(.93); }
.tool.on .ic { background: var(--accent); color: var(--on-accent); }
.tool.off { opacity: .45; }
.badge {
  position: absolute; top: -6px; right: -8px; min-width: 19px; height: 19px; padding: 0 5px;
  border-radius: 10px; border: 2px solid var(--bg);
  background: var(--accent); color: var(--on-accent);
  font-size: 11px; font-weight: 700; line-height: 15px; text-align: center;
}
.badge.zero { background: var(--hint); }

.pad { display: grid; grid-template-columns: repeat(9, 1fr); gap: 5px; flex: none; }
.key {
  height: clamp(52px, calc(var(--app-h, 100vh) * .075), 64px); border-radius: 12px; background: var(--surface);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  transition: opacity .2s, transform .1s;
}
.key .d { font-family: var(--serif); font-size: 27px; font-weight: 600; line-height: 1; color: var(--ink); font-variant-numeric: lining-nums; }
.key .c { font-size: 10px; line-height: 1; color: var(--hint); font-variant-numeric: tabular-nums; }
.key:active { transform: scale(.93); }
.key.done { opacity: .25; pointer-events: none; }
.pad.pencil .key .d { font-family: var(--sans); font-size: 20px; font-weight: 500; }

/* ---------- Шторки ---------- */
.backdrop {
  position: fixed; inset: 0; z-index: 20;
  display: flex; align-items: flex-end; justify-content: center;
  background: rgba(0, 0, 0, .38); animation: fade .2s ease-out;
}
.sheet {
  width: 100%; max-width: 520px; max-height: 92%; overflow: auto;
  background: var(--surface); border-radius: 18px 18px 0 0;
  padding: 20px 16px calc(16px + var(--safe-b));
  animation: rise .28s cubic-bezier(.2, .8, .2, 1);
}
.sheet h2 { font-family: var(--serif); font-size: 26px; font-weight: 600; line-height: 1.15; margin: 0 4px 14px; }
.sheet .sub { color: var(--hint); font-size: 15px; line-height: 1.35; margin: -6px 4px 18px; }
.sheet.center { text-align: center; }
@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { transform: translateY(40px); } }

.group { background: var(--section); border-radius: 14px; overflow: hidden; }
.row { width: 100%; display: flex; align-items: center; gap: 12px; padding: 13px 12px 13px 14px; text-align: left; position: relative; }
.row + .row::before { content: ""; position: absolute; top: 0; left: 14px; right: 0; height: 1px; background: var(--sep); }
.row:active { background: var(--peer); }
.row .txt { flex: 1; min-width: 0; }
.row .name { display: block; font-size: 17px; font-weight: 600; }
.row .desc { display: block; font-size: 13px; color: var(--hint); margin-top: 2px; }
.row .rec { font-size: 13px; color: var(--hint); font-variant-numeric: tabular-nums; white-space: nowrap; }
.row svg { width: 18px; height: 18px; color: var(--hint); flex: none; }
.credit { font-size: 12px; color: var(--hint); text-align: center; margin-top: 14px; }

.btn { display: block; width: 100%; height: 50px; border-radius: 12px; font-size: 16px; font-weight: 600; margin-top: 10px; }
.btn.primary { background: var(--accent); color: var(--on-accent); }
.btn.plain { background: var(--section); color: var(--ink); }
.btn:active { opacity: .85; }

.results { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--section); border-radius: 14px; padding: 14px 4px; margin-bottom: 8px; }
.results div + div { border-left: 1px solid var(--sep); }
.results b { display: block; font-family: var(--serif); font-size: 24px; font-weight: 600; font-variant-numeric: lining-nums tabular-nums; }
.results span { display: block; font-size: 12px; color: var(--hint); margin-top: 4px; }
.results .new-rec b, .results .new-rec span { color: var(--ink); }

.toast {
  position: fixed; left: 50%; top: 56px; z-index: 30; transform: translate(-50%, -8px);
  max-width: calc(100% - 32px); padding: 9px 14px; border-radius: 12px;
  background: var(--text); color: var(--bg); font-size: 14px; white-space: nowrap;
  opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0ms !important; transition: none !important; }
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <button class="new" id="btn-new" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
      Новая игра
    </button>
  </header>

  <main class="play">
    <div class="meta">
      <span class="lvl" id="level"></span>
      <span id="mistakes"></span>
      <span class="clock">
        <span class="time" id="time">00:00</span>
        <button class="icon" id="btn-pause" type="button" aria-label="Пауза"></button>
      </span>
    </div>
    <div class="board-wrap">
      <div class="board" id="board" role="grid" aria-label="Поле судоку"></div>
      <div class="paused" id="paused" hidden>
        <p>Пауза</p>
        <button class="btn primary" id="resume" type="button">Продолжить</button>
      </div>
    </div>

    <div class="tools">
      <button class="tool" id="t-undo" type="button">
        <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5 5.5 5.5 0 0 1-5.5 5.5H11"/></svg></span>
        Отменить
      </button>
      <button class="tool" id="t-erase" type="button">
        <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg></span>
        Стереть
      </button>
      <button class="tool" id="t-notes" type="button" aria-pressed="false">
        <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.17 6.81a1 1 0 0 0-3.99-3.99L3.84 16.17a2 2 0 0 0-.5.83l-1.32 4.35a.5.5 0 0 0 .62.62l4.35-1.32a2 2 0 0 0 .83-.5z"/><path d="m15 5 4 4"/></svg></span>
        Заметки
      </button>
      <button class="tool" id="t-hint" type="button">
        <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></svg><span class="badge" id="hint-n">3</span></span>
        Подсказка
      </button>
    </div>

    <div class="pad" id="pad"></div>
  </main>
</div>

<!-- Выбор уровня -->
<div class="backdrop" id="sh-new" hidden>
  <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="new-title">
    <h2 id="new-title">Новая игра</h2>
    <div class="group" id="levels"></div>
    <button class="btn plain" id="back-to-game" type="button">Вернуться к игре</button>
    <p class="credit">Задачи — из открытого банка Sudoku Exchange</p>
  </section>
</div>

<!-- Победа -->
<div class="backdrop" id="sh-win" hidden>
  <section class="sheet center" role="dialog" aria-modal="true" aria-labelledby="win-title">
    <h2 id="win-title">Решено!</h2>
    <p class="sub" id="win-sub"></p>
    <div class="results">
      <div><b id="win-time">00:00</b><span>время</span></div>
      <div id="win-best-box"><b id="win-best">—</b><span id="win-best-label">рекорд</span></div>
      <div><b id="win-wins">1</b><span>побед на уровне</span></div>
    </div>
    <button class="btn primary" id="win-again" type="button">Сыграть ещё</button>
    <button class="btn plain" id="win-change" type="button">Выбрать уровень</button>
  </section>
</div>

<!-- Лимит ошибок -->
<div class="backdrop" id="sh-over" hidden>
  <section class="sheet center" role="dialog" aria-modal="true" aria-labelledby="over-title">
    <h2 id="over-title">3 ошибки</h2>
    <p class="sub">Партия остановлена. Последнюю ошибку можно стереть и играть дальше.</p>
    <button class="btn primary" id="over-continue" type="button">Стереть ошибку и продолжить</button>
    <button class="btn plain" id="over-new" type="button">Новая игра</button>
  </section>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* Головоломки: открытый банк Sudoku Exchange (public domain),
   https://github.com/grantm/sudoku-exchange-puzzle-bank — обновить: python tools/build_puzzles.py */
/* PUZZLES:BEGIN */

        if (g[i]) continue;
        const m = ~(rows[R[i]] | cols[C[i]] | boxes[B[i]]) & 0x3FE, n = count(m);
        if (n < bestN) { best = i; bestMask = m; bestN = n; if (n < 2) break; }
      }
      if (best < 0) return true;
      const r = R[best], c = C[best], b = B[best];
      for (let m = bestMask; m; m &= m - 1) {
        const bit = m & -m;
        g[best] = 31 - Math.clz32(bit);
        rows[r] |= bit; cols[c] |= bit; boxes[b] |= bit;
        if (rec()) return true;
        rows[r] ^= bit; cols[c] ^= bit; boxes[b] ^= bit;
      }
      g[best] = 0;
      return false;
    };
    return rec() ? g : null;
  }

  /* Перестановки, сохраняющие сложность и единственность решения: цифры, строки внутри полос,
     полосы, столбцы, транспонирование. Из одной задачи банка получаются тысячи непохожих. */
  function shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }
  function remix(g) {
    const digits = shuffle([1, 2, 3, 4, 5, 6, 7, 8, 9]);
    const order = () => shuffle([0, 1, 2]).flatMap(band => shuffle([0, 1, 2]).map(k => band * 3 + k));
    const rows = order(), cols = order(), flip = Math.random() < 0.5, out = new Array(81);
    for (let r = 0; r < 9; r++) for (let c = 0; c < 9; c++) {
      const v = flip ? g[cols[c] * 9 + rows[r]] : g[rows[r] * 9 + cols[c]];
      out[r * 9 + c] = v ? digits[v - 1] : 0;
    }
    return out;
  }

  /* ===== Состояние ===== */
  let S = null;             // текущая партия
  let stats = {};           // { easy: { wins, best }, ... }, best — в мс
  let selected = -1;
  let notesMode = false;
  let paused = false;
  let undoStack = [];
  let sheet = null;         // открытая шторка: 'new' | 'win' | 'over'
  let tgInactive = false;   // мини-апп свёрнут
  let touched = false;      // игрок уже что-то сделал в этом запуске
  let winRecord = false;

  /* ===== Разметка поля и цифр ===== */
  const boardEl = $('#board'), padEl = $('#pad');
  const cells = [], keys = [];
  for (let i = 0; i < 81; i++) {
    const el = document.createElement('div');
    let base = 'cell';
    if (C[i] === 2 || C[i] === 5) base += ' br'; else if (C[i] === 8) base += ' br0';
    if (R[i] === 2 || R[i] === 5) base += ' bb'; else if (R[i] === 8) base += ' bb0';
    el.className = base;
    el.setAttribute('role', 'gridcell');
    el.innerHTML = '<b class="fx"></b><span class="v"></span><div class="notes">' + '<i></i>'.repeat(9) + '</div>';
    el.addEventListener('pointerdown', e => { e.preventDefault(); select(i); });
    boardEl.appendChild(el);
    cells.push({ el, base, fx: el.children[0], v: el.children[1], marks: [...el.children[2].children] });
  }
  for (let d = 1; d <= 9; d++) {
    const k = document.createElement('button');
    k.className = 'key';
    k.type = 'button';
    k.setAttribute('aria-label', 'Цифра ' + d);
    k.innerHTML = '<span class="d">' + d + '</span><span class="c"></span>';
    k.addEventListener('click', () => input(d));
    padEl.appendChild(k);
    keys.push({ el: k, c: k.lastChild });
  }

  /* ===== Отрисовка ===== */
  const pad2 = n => String(n).padStart(2, '0');
  function fmt(ms) {
    const s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60;
    return h ? h + ':' + pad2(m) + ':' + pad2(s % 60) : pad2(m) + ':' + pad2(s % 60);
  }
  function plural(n, forms) {
    const a = Math.abs(n) % 100, b = a % 10;
    return forms[a > 10 && a < 20 ? 2 : b > 1 && b < 5 ? 1 : b === 1 ? 0 : 2];
  }
  function renderTime() {
    const t = S ? fmt(S.elapsed) : '00:00', el = $('#time');
    if (el.textContent !== t) el.textContent = t;
  }

  function render() {
    const has = !!S;
    const selV = has && selected >= 0 ? S.values[selected] : 0;
    const selWrong = !!selV && selV !== S.solution[selected];
    const peers = has && selected >= 0 ? PEER_SET[selected] : null;

    for (let i = 0; i < 81; i++) {
      const c = cells[i], v = has ? S.values[i] : 0;
      let cls = c.base;
      if (has) {
        if (S.puzzle[i]) cls += ' given'; else if (v) cls += ' user';
        if (v && v !== S.solution[i]) cls += ' wrong';
        if (i === selected) cls += ' sel';
        else if (selV && v === selV) { cls += ' same'; if (selWrong && peers.has(i)) cls += ' clash'; }
        else if (peers && peers.has(i)) cls += ' peer';
      }
      if (c.el.className !== cls) c.el.className = cls;
      const txt = v ? String(v) : '';
      if (c.v.textContent !== txt) c.v.textContent = txt;
      const n = has && !v ? S.notes[i] : 0;
      for (let d = 1; d <= 9; d++) {
        const m = c.marks[d - 1], on = (n >> d) & 1;
        const t = on ? String(d) : '', hc = on && d === selV ? 'hl' : '';
        if (m.textContent !== t) m.textContent = t;
        if (m.className !== hc) m.className = hc;
      }
    }

    const placed = new Array(10).fill(0);
    if (has) for (let i = 0; i < 81; i++) if (S.values[i] && S.values[i] === S.solution[i]) placed[S.values[i]]++;
    keys.forEach((k, idx) => {
      const left = 9 - placed[idx + 1];
      k.c.textContent = has ? String(left) : '';
      k.el.classList.toggle('done', has && left === 0);
    });
    padEl.classList.toggle('pencil', notesMode);

    const notesBtn = $('#t-notes');
    notesBtn.classList.toggle('on', notesMode);
    notesBtn.setAttribute('aria-pressed', String(notesMode));
    $('#t-undo').classList.toggle('off', !undoStack.length);
    const hn = $('#hint-n');
    hn.textContent = String(has ? S.hintsLeft : CONFIG.hints);
    hn.classList.toggle('zero', has && !S.hintsLeft);

    $('#level').textContent = has ? LEVELS[S.level].name : '';
    const mEl = $('#mistakes');
    mEl.textContent = has ? 'Ошибки ' + S.mistakes + (CONFIG.maxMistakes ? '/' + CONFIG.maxMistakes : '') : '';
    mEl.classList.toggle('bad', has && S.mistakes > 0);

    $('#paused').hidden = !(paused && has && S.status === 'play');
    const pb = $('#btn-pause');
    pb.innerHTML = paused ? ICON.play : ICON.pause;
    pb.setAttribute('aria-label', paused ? 'Продолжить' : 'Пауза');
    renderTime();
  }

  let toastTimer = 0;
  function toast(msg) {
    const el = $('#toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 1600);
  }

  /* Вспышка заполненных строки, столбца или квадрата расходится от поставленной цифры. */
  function flash(list, origin) {
    for (const i of list) {
      const fx = cells[i].fx;
      fx.style.animationDelay = (Math.abs(R[i] - R[origin]) + Math.abs(C[i] - C[origin])) * 45 + 'ms';
      fx.classList.remove('go'); void fx.offsetWidth; fx.classList.add('go');
    }
  }
  function wave(origin) {
    for (let i = 0; i < 81; i++) {
      const { fx, v } = cells[i];
      const d = (Math.abs(R[i] - R[origin]) + Math.abs(C[i] - C[origin])) * 55 + 'ms';
      fx.style.animationDelay = d; v.style.animationDelay = d;
      fx.classList.remove('go'); v.classList.remove('pop');
      void fx.offsetWidth;
      fx.classList.add('go'); v.classList.add('pop');
    }
  }

  /* ===== Таймер ===== */
  let lastTick = 0, lastLocalSave = 0;
  const isRunning = () => !!S && S.status === 'play' && !paused && !sheet && !document.hidden && !tgInactive;
  function tick() {
    const now = performance.now();
    if (lastTick && S) S.elapsed += now - lastTick;
    lastTick = isRunning() ? now : 0;
    renderTime();
    if (lastTick && now - lastLocalSave > 5000) { lastLocalSave = now; local.set(KEY_GAME, serialize()); }
  }
  setInterval(tick, 250);

  /* ===== Сохранение ===== */
  function serialize() {
    return JSON.stringify({
      v: 1, l: S.level,
      p: S.puzzle.join(''), s: S.solution.join(''), x: S.values.join(''),
      n: S.notes.map(n => (n >> 1).toString(36).padStart(2, '0')).join(''),
      m: S.mistakes, h: S.hintsLeft, hu: S.hintsUsed,
      t: Math.round(S.elapsed), st: S.status, lw: S.lastWrong, at: Date.now(),
    });
  }
  function parseGame(raw) {
    try {
      const o = JSON.parse(raw);
      const digits = s => (typeof s === 'string' && /^[0-9]{81}$/.test(s) ? [...s].map(Number) : null);
      if (!o || o.v !== 1 || !LEVELS[o.l]) return null;
      const p = digits(o.p), s = digits(o.s), x = digits(o.x);
      if (!p || !s || !x || s.includes(0) || typeof o.n !== 'string' || o.n.length !== 162) return null;
      for (let i = 0; i < 81; i++) if (p[i] && (p[i] !== s[i] || x[i] !== p[i])) return null;
      const notes = [];
      for (let i = 0; i < 81; i++) notes.push(((parseInt(o.n.substr(i * 2, 2), 36) || 0) << 1) & 0x3FE);
      return {
        level: o.l, puzzle: p, solution: s, values: x, notes,
        mistakes: Math.max(0, +o.m || 0), hintsLeft: Math.max(0, +o.h || 0), hintsUsed: Math.max(0, +o.hu || 0),
        elapsed: Math.max(0, +o.t || 0), status: ['play', 'won', 'over'].includes(o.st) ? o.st : 'play',
        lastWrong: Number.isInteger(o.lw) ? o.lw : -1, at: +o.at || 0,
      };
    } catch (e) { return null; }
  }
  function parseStats(raw) {
    try { const o = JSON.parse(raw); return o && typeof o === 'object' ? o : null; } catch (e) { return null; }
  }
  function mergeStats(a, b) {
    const out = {};
    for (const k of Object.keys(LEVELS)) {
      const x = (a && a[k]) || {}, y = (b && b[k]) || {};
      const best = [x.best, y.best].filter(v => v > 0);
      out[k] = { wins: Math.max(x.wins || 0, y.wins || 0), best: best.length ? Math.min(...best) : 0 };
    }
    return out;
  }
  function saveStats() {
    const s = JSON.stringify(stats);
    local.set(KEY_STATS, s);
    cloud.set(KEY_STATS, s);
  }
  let saveTimer = 0, cloudTimer = 0;
  function save(now) {
    if (!S) return;
    clearTimeout(saveTimer); clearTimeout(cloudTimer);
    if (now) { const d = serialize(); local.set(KEY_GAME, d); cloud.set(KEY_GAME, d); return; }
    saveTimer = setTimeout(() => local.set(KEY_GAME, serialize()), 300);
    cloudTimer = setTimeout(() => cloud.set(KEY_GAME, serialize()), 2500);
  }
  function changed() { touched = true; render(); save(); }

  /* ===== Игра ===== */
  function newGame(level) {
    const list = PUZZLES[level];
    if (!list || !list.length) { toast('Нет задач для этого уровня'); return; }
    let puzzle = null, solution = null;
    for (let k = 0; k < 10 && !solution; k++) {
      puzzle = remix([...list[(Math.random() * list.length) | 0]].map(Number));
      solution = solve(puzzle);
    }
    if (!solution) { toast('Не удалось загрузить задачу'); return; }
    S = {
      level, puzzle, solution, values: puzzle.slice(), notes: new Array(81).fill(0),
      mistakes: 0, hintsLeft: CONFIG.hints, hintsUsed: 0, elapsed: 0, status: 'play', lastWrong: -1,
    };
    selected = -1; notesMode = false; paused = false; undoStack = [];
    closeSheet();
    changed();
    save(true);
    haptic.impact('medium');
  }

  const playable = () => !!S && S.status === 'play' && !paused && !sheet;

  function select(i) {
    if (!playable()) return;
    if (i !== selected) haptic.select();
    selected = i;
    render();
  }
  function move(dr, dc) {
    if (!playable()) return;
    if (selected < 0) return select(40);
    select(((R[selected] + dr + 9) % 9) * 9 + ((C[selected] + dc + 9) % 9));
  }

  function pushUndo(list) {
    undoStack.push(list.map(i => [i, S.values[i], S.notes[i]]));
    if (undoStack.length > 300) undoStack.shift();
  }
  /* Клетки-соседи, из заметок которых надо убрать цифру d (для отмены сохраняем их тоже). */
  function peersWithNote(i, d) {
    return PEERS[i].filter(p => !S.values[p] && (S.notes[p] >> d) & 1);
  }
  function solvedUnits(i) {
    const out = new Set();
    for (const unit of UNITS[i]) if (unit.every(j => S.values[j] === S.solution[j])) unit.forEach(j => out.add(j));
    return [...out];
  }
  const isSolved = () => S.values.every((v, i) => v === S.solution[i]);

  function input(d) {
    if (!playable()) return;
    if (selected < 0) { toast('Сначала выберите клетку'); haptic.notify('warning'); return; }
    const i = selected, cur = S.values[i];
    if (S.puzzle[i] || (cur && cur === S.solution[i])) { haptic.notify('warning'); return; }

    if (notesMode) {
      pushUndo([i]);
      S.values[i] = 0;
      S.notes[i] ^= 1 << d;
      haptic.impact('light');
      changed();
      return;
    }
    if (cur === d) return;

    const correct = d === S.solution[i];
    const affected = correct ? peersWithNote(i, d) : [];
    pushUndo([i, ...affected]);
    S.values[i] = d;
    S.notes[i] = 0;

    if (correct) {
      affected.forEach(p => { S.notes[p] &= ~(1 << d); });
      if (isSolved()) return win(i);
      const done = solvedUnits(i);
      if (done.length) { flash(done, i); haptic.impact('medium'); } else haptic.impact('light');
      changed();
      return;
    }

    S.mistakes++;
    S.lastWrong = i;
    haptic.notify('error');
    if (CONFIG.maxMistakes && S.mistakes >= CONFIG.maxMistakes) {
      S.status = 'over';
      changed();
      save(true);
      openSheet('over');
      return;
    }
    changed();
  }

  function erase() {
    if (!playable() || selected < 0) return;
    const i = selected;
    if (S.puzzle[i] || (S.values[i] && S.values[i] === S.solution[i])) { haptic.notify('warning'); return; }
    if (!S.values[i] && !S.notes[i]) return;
    pushUndo([i]);
    S.values[i] = 0;
    S.notes[i] = 0;
    haptic.impact('light');
    changed();
  }

  function undo() {
    if (!playable()) return;
    const snap = undoStack.pop();
    if (!snap) { toast('Нечего отменять'); return; }
    for (const [i, v, n] of snap) { S.values[i] = v; S.notes[i] = n; }
    selected = snap[0][0];
    haptic.impact('light');
    changed();
  }

  function toggleNotes() {
    if (!playable()) return;
    notesMode = !notesMode;
    haptic.select();
    render();
  }

  /* Подсказка открывает выбранную клетку, а если она уже верна —
     клетку с наименьшим числом вариантов, то есть следующий логичный ход. */
  function hintTarget() {
    if (selected >= 0 && S.values[selected] !== S.solution[selected]) return selected;
    let best = -1, bestN = 10;
    for (let i = 0; i < 81; i++) {
      if (S.values[i] === S.solution[i]) continue;
      let used = 0;
      for (const p of PEERS[i]) { const v = S.values[p]; if (v && v === S.solution[p]) used |= 1 << v; }
      let n = 0;
      for (let d = 1; d <= 9; d++) if (!((used >> d) & 1)) n++;
      if (n < bestN || (n === bestN && Math.random() < 0.3)) { best = i; bestN = n; }
    }
    return best;
  }
  function hint() {
    if (!playable()) return;
    if (S.hintsLeft <= 0) { toast('Подсказки закончились'); haptic.notify('warning'); return; }
    const i = hintTarget();
    if (i < 0) return;
    const d = S.solution[i], affected = peersWithNote(i, d);
    pushUndo([i, ...affected]);
    S.values[i] = d;
    S.notes[i] = 0;
    affected.forEach(p => { S.notes[p] &= ~(1 << d); });
    S.hintsLeft--;
    S.hintsUsed++;
    selected = i;
    if (isSolved()) return win(i);
    const done = solvedUnits(i);
    flash(done.length ? done : [i], i);
    haptic.impact('medium');
    changed();
  }

  function win(origin) {
    S.status = 'won';
    selected = -1;
    notesMode = false;
    tick();
    const st = stats[S.level] || (stats[S.level] = { wins: 0, best: 0 });
    winRecord = !st.best || S.elapsed < st.best;
    st.wins = (st.wins || 0) + 1;
    if (winRecord) st.best = Math.round(S.elapsed);
    saveStats();
    touched = true;
    render();
    save(true);
    haptic.notify('success');
    wave(origin);
    setTimeout(() => { if (S && S.status === 'won' && !sheet) openSheet('win'); }, 1300);
  }

  function secondChance() {
    if (!S || S.status !== 'over') return;
    const i = S.lastWrong;
    if (i >= 0 && S.values[i] && S.values[i] !== S.solution[i]) S.values[i] = 0;
    S.mistakes = Math.max(0, CONFIG.maxMistakes - 1);
    S.status = 'play';
    selected = i;
    closeSheet();
    changed();
  }

  function togglePause(force) {
    if (!S || S.status !== 'play' || sheet) return;
    paused = typeof force === 'boolean' ? force : !paused;
    render();
    tick();
    if (paused) save(true);
  }

  /* ===== Шторки ===== */
  function sheetClosable() {
    if (sheet === 'new') return !!S && S.status === 'play';
    return sheet === 'win';
  }
  function syncBackButton() {
    if (!tgv('6.1')) return;
    try { if (sheet && sheetClosable()) TG.BackButton.show(); else TG.BackButton.hide(); } catch (e) {}
  }
  function openSheet(name) {
    if (sheet) $('#sh-' + sheet).hidden = true;
    sheet = name;
    if (name === 'new') fillLevels();
    if (name === 'win') fillWin();
    if (name === 'over') fillOver();
    $('#sh-' + name).hidden = false;
    syncBackButton();
    tick();
  }
  function closeSheet() {
    if (!sheet) return;
    $('#sh-' + sheet).hidden = true;
    sheet = null;
    syncBackButton();
    tick();
  }

  function fillLevels() {
    const box = $('#levels');
    box.textContent = '';
    for (const [key, L] of Object.entries(LEVELS)) {
      const st = stats[key];
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'row';
      b.innerHTML = '<span class="txt"><span class="name"></span><span class="desc"></span></span><span class="rec"></span>' + ICON.chevron;
      b.querySelector('.name').textContent = L.name;
      b.querySelector('.desc').textContent = L.desc;
      b.querySelector('.rec').textContent = st && st.best ? 'рекорд ' + fmt(st.best) : '';
      b.addEventListener('click', () => newGame(key));
      box.appendChild(b);
    }
    $('#back-to-game').hidden = !sheetClosable();
  }
  function fillWin() {
    const st = stats[S.level] || {};
    const parts = [];
    if (S.mistakes) parts.push(S.mistakes + ' ' + plural(S.mistakes, ['ошибка', 'ошибки', 'ошибок']));
    if (S.hintsUsed) parts.push(S.hintsUsed + ' ' + plural(S.hintsUsed, ['подсказка', 'подсказки', 'подсказок']));
    $('#win-sub').textContent = LEVELS[S.level].name + ' уровень, ' + (parts.length ? parts.join(' и ') : 'без ошибок и подсказок');
    $('#win-time').textContent = fmt(S.elapsed);
    $('#win-best').textContent = st.best ? fmt(st.best) : '—';
    $('#win-wins').textContent = String(st.wins || 1);
    $('#win-best-box').classList.toggle('new-rec', winRecord);
    $('#win-best-label').textContent = winRecord ? 'новый рекорд' : 'рекорд';
  }
  function fillOver() {
    const n = S.mistakes;
    $('#over-title').textContent = n + ' ' + plural(n, ['ошибка', 'ошибки', 'ошибок']);
  }

  /* ===== События ===== */
  $('#btn-new').addEventListener('click', () => openSheet('new'));
  $('#btn-pause').addEventListener('click', () => togglePause());
  $('#resume').addEventListener('click', () => togglePause(false));
  $('#t-undo').addEventListener('click', undo);
  $('#t-erase').addEventListener('click', erase);
  $('#t-notes').addEventListener('click', toggleNotes);
  $('#t-hint').addEventListener('click', hint);
  $('#back-to-game').addEventListener('click', closeSheet);
  $('#win-again').addEventListener('click', () => newGame(S.level));
  $('#win-change').addEventListener('click', () => openSheet('new'));
  $('#over-continue').addEventListener('click', secondChance);
  $('#over-new').addEventListener('click', () => openSheet('new'));
  document.querySelectorAll('.backdrop').forEach(bd => {
    bd.addEventListener('click', e => { if (e.target === bd && sheetClosable()) closeSheet(); });
  });
  // После нажатия пальцем или мышью снимаем фокус, иначе при вводе с клавиатуры
  // вокруг последней нажатой кнопки остаётся рамка. Нажатие с клавиатуры (detail = 0) фокус сохраняет.
  document.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (b && e.detail > 0) b.blur();
  });

  document.addEventListener('keydown', e => {
    if (e.altKey) return;
    if (sheet) { if (e.key === 'Escape' && sheetClosable()) closeSheet(); return; }
    const k = e.key;
    if (k.length === 1 && k >= '1' && k <= '9' && !e.ctrlKey && !e.metaKey) { input(+k); e.preventDefault(); return; }
    switch (e.code) {
      case 'ArrowUp': move(-1, 0); break;
      case 'ArrowDown': move(1, 0); break;
      case 'ArrowLeft': move(0, -1); break;
      case 'ArrowRight': move(0, 1); break;
      case 'Backspace': case 'Delete': case 'Digit0': case 'Numpad0': erase(); break;
      case 'KeyN': toggleNotes(); break;
      case 'KeyZ': undo(); break;
      case 'Space': togglePause(); break;
      case 'Escape': togglePause(false); break;
      default: return;
    }
    e.preventDefault();
  });

  document.addEventListener('visibilitychange', () => { tick(); if (document.hidden) save(true); });
  window.addEventListener('pagehide', () => save(true));

  /* ===== Запуск ===== */
  function layout() {
    let h = window.innerHeight;
    if (IN_TG && TG.viewportStableHeight) h = Math.min(h, TG.viewportStableHeight) || h;
    document.documentElement.style.setProperty('--app-h', h + 'px');
  }
  function applyTheme() {
    if (!IN_TG) return;
    document.documentElement.dataset.theme = TG.colorScheme === 'dark' ? 'dark' : 'light';
    try {
      if (tgv('6.1')) { TG.setHeaderColor('bg_color'); TG.setBackgroundColor('bg_color'); }
      if (tgv('7.10')) TG.setBottomBarColor('bg_color');
    } catch (e) {}
  }
  function restore(game) {
    if (game) S = game;
    selected = -1; notesMode = false; paused = false; undoStack = [];
    render();
    if (!S || S.status === 'won') openSheet('new');
    else if (S.status === 'over') openSheet('over');
    else closeSheet();
    tick();
  }

  async function boot() {
    applyTheme();
    layout();
    window.addEventListener('resize', layout);
    stats = mergeStats(parseStats(local.get(KEY_STATS)), null);
    const localGame = parseGame(local.get(KEY_GAME));
    restore(localGame);

    if (IN_TG) {
      try {
        TG.ready();
        TG.expand();
        if (tgv('7.7')) TG.disableVerticalSwipes(); // свайп по полю не закрывает приложение
        TG.onEvent('themeChanged', applyTheme);
        TG.onEvent('viewportChanged', layout);
        TG.onEvent('activated', () => { tgInactive = false; tick(); });
        TG.onEvent('deactivated', () => { tgInactive = true; tick(); save(true); });
        if (tgv('6.1')) TG.BackButton.onClick(() => { if (sheetClosable()) closeSheet(); });
      } catch (e) {}
    }

    // Облако Telegram: рекорды и незаконченная партия с другого устройства.
    const res = await cloud.get([KEY_GAME, KEY_STATS]);
    const cloudStats = parseStats(res[KEY_STATS]);
    if (cloudStats) { stats = mergeStats(stats, cloudStats); if (sheet === 'new') fillLevels(); }
    const cloudGame = parseGame(res[KEY_GAME]);
    if (cloudGame && !touched && (!localGame || cloudGame.at > localGame.at)) restore(cloudGame);
  }

  boot();
})();
</script>
</body>
</html>
